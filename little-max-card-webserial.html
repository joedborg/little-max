<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little MAX PES Transfer</title>
  <style>
    :root {
      --bg: #f5f0e5;
      --panel: #fffaf1;
      --line: #d8cfbd;
      --ink: #1e2a30;
      --accent: #0f6c61;
      --accent-soft: #dff1eb;
      --warn: #8d2d16;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 0% 0%, #f3e7c9 0%, transparent 34%),
        radial-gradient(circle at 100% 100%, #d7eee7 0%, transparent 28%),
        var(--bg);
      padding: 18px;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(21, 34, 39, 0.08);
    }

    header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(120deg, var(--accent-soft), #f9f2da 72%);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.92;
      line-height: 1.35;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      border: 1px solid #c8bca6;
      border-radius: 999px;
      background: #f6efde;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .status.on {
      background: #dcf1e9;
      border-color: #88bcae;
      color: #0d5a51;
    }

    main {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fffdf8;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #31444c;
    }

    input,
    button {
      font: inherit;
      width: 100%;
    }

    input[type="file"] {
      border: 1px solid #c4b8a3;
      border-radius: 8px;
      padding: 7px 8px;
      background: #fff;
      margin-bottom: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      border: 1px solid #8fb9af;
      border-radius: 999px;
      background: #e8f4f1;
      color: #0e5b52;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover { background: #d8ece7; }

    .btn.warn {
      border-color: #c29383;
      background: #f8ece7;
      color: var(--warn);
    }

    .log {
      margin: 0;
      border: 1px solid #153843;
      border-radius: 8px;
      background: #0c1b21;
      color: #d8fbef;
      padding: 10px;
      min-height: 160px;
      max-height: 240px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .hint {
      font-size: 0.83rem;
      color: #445861;
      line-height: 1.35;
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Little MAX PES Transfer</h1>
      <p class="subtitle">Read PES files from card and write PES files to card using Web Serial.</p>
      <div id="status" class="status">Disconnected</div>
    </header>

    <main>
      <section class="card">
        <h2>Device</h2>
        <div class="row">
          <button id="connect" class="btn">Request + Connect</button>
          <button id="disconnect" class="btn warn">Disconnect</button>
        </div>
        <p class="hint">Use Chrome/Edge on http://localhost or HTTPS for Web Serial support.</p>
      </section>

      <section class="card">
        <h2>Read PES From Card</h2>
        <button id="readPes" class="btn">Read PES And Download</button>
      </section>

      <section class="card">
        <h2>Write PES To Card</h2>
        <label for="pesFile">Select PES file</label>
        <input id="pesFile" type="file" accept=".pes,application/octet-stream">
        <button id="writePes" class="btn">Upload PES To Card</button>
      </section>

      <section class="card">
        <h2>Activity</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const ui = {
        status: document.getElementById("status"),
        log: document.getElementById("log"),
        pesFile: document.getElementById("pesFile")
      };

      const q = {
        baudRate: 230400,
        dataBits: 8,
        stopBits: 1,
        parity: "none",
        flowControl: "none",
        readIdleMs: 350,
        readMaxMs: 4500,
        passiveReadMs: 4000,
        pullRounds: 400,
        pullMaxMs: 25000,
        pullInterCmdMs: 18,
        pullIdleMs: 110,
        minLikelyPesBytes: 65536,
        targetPesCount: 2,
        chunkSize: 128,
        chunkDelayMs: 30,
        readCmd: [0x02, 0x22, 0x5A, 0x03, 0x00],
        readCmdSet: [
          [0x02, 0x22, 0x5A, 0x03, 0x00],
          [0x02, 0xA6, 0xB0, 0x03],
          [0x02, 0xD4, 0x7F, 0x03, 0x00],
          [0x02, 0xF4, 0x20, 0x03, 0x00]
        ],
        writeStartCmd: [0x02, 0xA6, 0xB0, 0x03],
        writeEndCmd: [0x02, 0xD4, 0x80, 0x03]
      };

      let p = null;
      let r = null;
      let w = null;
      let run = false;
      let busy = false;
      let rxBytesSinceLog = 0;
      let lastRxLogTs = 0;

      const cap = {
        on: false,
        chunks: [],
        total: 0,
        lastTs: 0
      };

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function ts() {
        return new Date().toISOString();
      }

      function log(prefix, msg) {
        ui.log.textContent += `[${ts()}] ${prefix} ${msg}\n`;
        ui.log.scrollTop = ui.log.scrollHeight;
      }

      function setState(on, detail = "") {
        if (on) {
          ui.status.classList.add("on");
          ui.status.textContent = detail ? `Connected (${detail})` : "Connected";
        } else {
          ui.status.classList.remove("on");
          ui.status.textContent = "Disconnected";
        }
      }

      function hx(bytes) {
        return Array.from(bytes).map((b) => b.toString(16).toUpperCase().padStart(2, "0")).join(" ");
      }

      function joinChunks(chunks, total) {
        const out = new Uint8Array(total);
        let off = 0;
        for (const c of chunks) {
          out.set(c, off);
          off += c.length;
        }
        return out;
      }

      function save(bytes, name) {
        const blob = new Blob([bytes], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
      }

      function setBusy(on) {
        busy = on;
        const ids = ["connect", "disconnect", "readPes", "writePes"];
        for (const id of ids) {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = on;
            el.style.opacity = on ? "0.7" : "1";
            el.style.cursor = on ? "wait" : "pointer";
          }
        }
      }

      async function ensureSupport() {
        if (!("serial" in navigator)) {
          throw new Error("Web Serial API is unavailable in this browser.");
        }
        if (!window.isSecureContext) {
          throw new Error("Use http://localhost or HTTPS.");
        }
      }

      async function readLoop() {
        if (!p || !p.readable) return;
        r = p.readable.getReader();
        run = true;
        try {
          while (run) {
            const { value, done } = await r.read();
            if (done) break;
            if (!value || !value.length) continue;

            const now = Date.now();
            if (cap.on) {
              cap.chunks.push(new Uint8Array(value));
              cap.total += value.length;
              cap.lastTs = now;
            }
            rxBytesSinceLog += value.length;
            if (!lastRxLogTs || now - lastRxLogTs >= 500) {
              log("RX", `${rxBytesSinceLog} bytes`);
              rxBytesSinceLog = 0;
              lastRxLogTs = now;
            }
          }
        } catch (err) {
          log("READ ERROR", err.message || String(err));
        } finally {
          if (r) {
            try { r.releaseLock(); } catch (_) {}
          }
          r = null;
          run = false;
        }
      }

      async function send(bytes) {
        if (!w) throw new Error("Connect first.");
        await w.write(new Uint8Array(bytes));
        log("TX", hx(bytes));
      }

      async function wake() {
        if (!p || typeof p.setSignals !== "function") return;
        await p.setSignals({ dataTerminalReady: true, requestToSend: true, break: false });
        await wait(100);
        await p.setSignals({ dataTerminalReady: false, requestToSend: true, break: false });
        await wait(100);
        await p.setSignals({ dataTerminalReady: true, requestToSend: true, break: false });
        await wait(140);
      }

      async function connect() {
        await ensureSupport();
        if (p) {
          log("INFO", "Already connected");
          return;
        }

        p = await navigator.serial.requestPort({});
        await p.open({
          baudRate: q.baudRate,
          dataBits: q.dataBits,
          stopBits: q.stopBits,
          parity: q.parity,
          flowControl: q.flowControl,
          bufferSize: 65536
        });

        w = p.writable.getWriter();
        const info = p.getInfo();
        setState(true, `VID ${info.usbVendorId || "?"} PID ${info.usbProductId || "?"}`);
        await wake();
        readLoop();
        log("INFO", "Connected and ready");
      }

      async function disconnect() {
        if (!p) return;
        run = false;
        if (r) {
          try { await r.cancel(); } catch (_) {}
        }
        if (w) {
          try { w.releaseLock(); } catch (_) {}
          w = null;
        }
        try {
          await p.close();
        } catch (err) {
          log("ERROR", err.message || String(err));
        }
        p = null;
        setState(false);
        log("INFO", "Disconnected");
      }

      async function captureAfterSend(command) {
        cap.on = true;
        cap.chunks = [];
        cap.total = 0;
        cap.lastTs = 0;

        await send(command);

        const started = Date.now();
        while (Date.now() - started <= q.readMaxMs) {
          if (cap.lastTs && Date.now() - cap.lastTs >= q.readIdleMs) {
            break;
          }
          await wait(25);
        }

        cap.on = false;
        return joinChunks(cap.chunks, cap.total);
      }

      async function passiveCapture(ms) {
        cap.on = true;
        cap.chunks = [];
        cap.total = 0;
        cap.lastTs = 0;
        const started = Date.now();
        while (Date.now() - started <= ms) {
          await wait(25);
        }
        cap.on = false;
        return joinChunks(cap.chunks, cap.total);
      }

      async function pullBulk() {
        cap.on = true;
        cap.chunks = [];
        cap.total = 0;
        cap.lastTs = 0;
        const startedAt = Date.now();

        let quietRounds = 0;
        let prevTotal = 0;

        for (let i = 0; i < q.pullRounds; i += 1) {
          if (Date.now() - startedAt >= q.pullMaxMs) {
            log("READ", `pull timeout at ${i} rounds`);
            break;
          }

          const cmd = q.readCmdSet[i % q.readCmdSet.length];
          await send(cmd);

          const until = Date.now() + q.pullIdleMs;
          while (Date.now() < until) {
            await wait(8);
          }

          if (cap.total > prevTotal) {
            quietRounds = 0;
            prevTotal = cap.total;
          } else {
            quietRounds += 1;
          }

          if (i > 30 && quietRounds >= 45) {
            break;
          }

          if ((i + 1) % 40 === 0) {
            log("READ", `pull ${i + 1}/${q.pullRounds}, bytes=${cap.total}`);
          }

          if ((i + 1) % 50 === 0 && cap.total >= q.minLikelyPesBytes * q.targetPesCount) {
            const snap = joinChunks(cap.chunks, cap.total);
            const found = extractPesFiles(snap).filter((f) => f.length >= q.minLikelyPesBytes);
            if (found.length >= q.targetPesCount) {
              log("READ", `early stop: found ${found.length} likely PES files`);
              break;
            }
          }

          if (q.pullInterCmdMs > 0) {
            await wait(q.pullInterCmdMs);
          }
        }

        cap.on = false;
        return joinChunks(cap.chunks, cap.total);
      }

      function findPesStarts(buffer) {
        const sig = [0x23, 0x50, 0x45, 0x53];
        const starts = [];
        for (let i = 0; i <= buffer.length - sig.length; i += 1) {
          if (
            buffer[i] === sig[0] &&
            buffer[i + 1] === sig[1] &&
            buffer[i + 2] === sig[2] &&
            buffer[i + 3] === sig[3]
          ) {
            starts.push(i);
          }
        }
        return starts;
      }

      function extractPesFiles(buffer) {
        const starts = findPesStarts(buffer);
        if (!starts.length) {
          return [];
        }

        const files = [];
        for (let i = 0; i < starts.length; i += 1) {
          const begin = starts[i];
          const end = i + 1 < starts.length ? starts[i + 1] : buffer.length;
          if (end > begin) {
            files.push(buffer.slice(begin, end));
          }
        }
        return files;
      }

      async function readPes() {
        if (busy) {
          log("INFO", "Read/write already in progress");
          return;
        }
        setBusy(true);
        log("READ", "Starting bulk read cycle...");
        try {
          const phase1 = await captureAfterSend(q.readCmd);
          log("READ", `phase1 bytes=${phase1.length}`);

          const phase2 = await passiveCapture(q.passiveReadMs);
          log("READ", `phase2 bytes=${phase2.length}`);

          const phase3 = await pullBulk();
          log("READ", `phase3 bytes=${phase3.length}`);

          const total = phase1.length + phase2.length + phase3.length;
          if (!total) {
            throw new Error("No data received from card.");
          }

          const all = new Uint8Array(total);
          all.set(phase1, 0);
          all.set(phase2, phase1.length);
          all.set(phase3, phase1.length + phase2.length);

          log("INFO", `Captured total ${all.length} bytes`);

          const pesFiles = extractPesFiles(all);
          if (!pesFiles.length) {
            const fallback = `card-raw-${new Date().toISOString().replace(/[:.]/g, "-")}.bin`;
            save(all, fallback);
            throw new Error(`No PES header found. Saved raw capture as ${fallback}`);
          }

          const stamp = new Date().toISOString().replace(/[:.]/g, "-");
          pesFiles.forEach((fileBytes, idx) => {
            const name = `card-read-${stamp}-${String(idx + 1).padStart(2, "0")}.pes`;
            save(fileBytes, name);
            log("INFO", `Saved ${fileBytes.length} bytes as ${name}`);
          });
        } finally {
          setBusy(false);
        }
      }

      async function writePes() {
        if (busy) {
          log("INFO", "Read/write already in progress");
          return;
        }
        setBusy(true);
        const file = ui.pesFile.files && ui.pesFile.files[0];
        if (!file) {
          setBusy(false);
          throw new Error("Choose a PES file first.");
        }

        const bytes = new Uint8Array(await file.arrayBuffer());
        if (!bytes.length) {
          setBusy(false);
          throw new Error("File is empty.");
        }
        try {
          await send(q.writeStartCmd);
          await wait(q.chunkDelayMs);

          let offset = 0;
          while (offset < bytes.length) {
            const end = Math.min(offset + q.chunkSize, bytes.length);
            const chunk = bytes.slice(offset, end);
            await send(chunk);
            offset = end;
            const pct = ((offset / bytes.length) * 100).toFixed(1);
            log("UPLOAD", `${offset}/${bytes.length} bytes (${pct}%)`);
            await wait(q.chunkDelayMs);
          }

          await send(q.writeEndCmd);
          log("INFO", "Upload complete");
        } finally {
          setBusy(false);
        }
      }

      async function guard(fn) {
        try {
          await fn();
        } catch (err) {
          log("ERROR", err.message || String(err));
        }
      }

      document.getElementById("connect").addEventListener("click", () => guard(connect));
      document.getElementById("disconnect").addEventListener("click", () => guard(disconnect));
      document.getElementById("readPes").addEventListener("click", () => guard(readPes));
      document.getElementById("writePes").addEventListener("click", () => guard(writePes));

      window.addEventListener("beforeunload", () => {
        if (p) disconnect();
      });

      log("READY", "Connect, then read or write PES.");
    })();
  </script>
</body>
</html>
